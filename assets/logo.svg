<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
    <defs>
        <linearGradient id="logoBgGrad" x1="10" y1="10" x2="250" y2="250" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2563eb" />
            <stop offset="0.6" stop-color="#1d4ed8" />
            <stop offset="1" stop-color="#ea580c" />
        </linearGradient>
        <linearGradient id="phoneGlow" x1="80" y1="40" x2="180" y2="180" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38bdf8" />
            <stop offset="1" stop-color="#818cf8" />
        </linearGradient>
        <filter id="shadow" x="0" y="0" width="260" height="260" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.4"/>
        </filter>
    </defs>
    <!-- Outer Glow Badge -->
    <rect x="15" y="15" width="230" height="230" rx="54" fill="url(#logoBgGrad)" filter="url(#shadow)"/>
    <rect x="20" y="20" width="220" height="220" rx="50" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
    
    <!-- Smartphone Frame -->
    <rect x="80" y="45" width="100" height="150" rx="22" fill="#0b1329" stroke="#ffffff" stroke-width="5"/>
    <!-- Screen Inner Display -->
    <rect x="86" y="52" width="88" height="136" rx="16" fill="#070d1a"/>
    <!-- Screen Graphic Wave -->
    <circle cx="130" cy="115" r="32" fill="url(#phoneGlow)" opacity="0.85"/>
    <path d="M100 135 C115 110, 145 110, 160 135" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top Speaker Notch -->
    <rect x="115" y="58" width="30" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Electric Signal Sparks -->
    <path d="M60 100 L45 115 L60 130" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 100 L215 115 L200 130" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wordmark below: BADER PHONES -->
    <text x="130" y="222" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">BADER PHONES</text>
</svg>
